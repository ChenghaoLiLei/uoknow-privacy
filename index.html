      { h: "Présentation", p: "UOKnow (« Ça va maintenant ? ») est une application de check-in de sécurité personnelle. Lorsque vous manquez une fenêtre de check-in, vos contacts d'urgence désignés sont notifiés. Cette politique explique les données que nous collectons, comment nous les utilisons et vos droits." },
      { h: "Données collectées", p: "• Informations sur les contacts d'urgence – les noms, adresses e-mail et numéros de téléphone que vous ajoutez. Stockés de manière chiffrée sur votre appareil via iOS Keychain.\n• Horodatages de check-in – la date et l'heure de chaque check-in enregistré.\n• Localisation (facultatif) – si vous activez le partage de localisation, vos coordonnées GPS au moment du check-in sont jointes aux alertes envoyées à vos contacts. La localisation n'est jamais collectée en arrière-plan.\n• Identifiant d'appareil – un identifiant aléatoire généré localement sur votre appareil. Il n'est pas lié à votre nom ou à votre identité." },
      { h: "Utilisation des données", p: "• Pour envoyer des notifications d'alerte à vos contacts d'urgence lorsqu'un check-in est manqué.\n• Pour planifier des notifications push de rappel quotidien sur votre appareil.\n• Pour afficher votre historique de check-in dans l'application." },
      { h: "Partage des données", p: "Les coordonnées de vos contacts d'urgence et l'identifiant de votre appareil sont transmis à notre serveur uniquement pour permettre la délivrance des alertes. Votre localisation (si activée) est incluse dans le message d'alerte envoyé à vos contacts.\n\nNous ne vendons, ne louons ni ne partageons vos données avec des annonceurs, des fournisseurs d'analyses ou des tiers au-delà de ce qui est nécessaire pour fournir le service." },
      { h: "Stockage et sécurité", p: "• Les informations de contact sont chiffrées sur votre appareil à l'aide d'iOS Keychain (expo-secure-store).\n• Notre serveur ne conserve que les données minimales nécessaires à l'envoi des notifications.\n• Aucun mot de passe ni identifiant d'authentification n'est stocké." },
      { h: "Vos droits", p: "• Supprimez toutes les données de l'application à tout moment via Paramètres → Réinitialiser toutes les données.\n• Désactivez le partage de localisation à tout moment dans Paramètres.\n• Supprimez des contacts d'urgence à tout moment.\n• Aucun compte ni inscription n'est requis pour utiliser cette application." },
      { h: "Confidentialité des enfants", p: "UOKnow n'est pas destiné aux enfants de moins de 13 ans. Nous ne collectons pas sciemment des données auprès d'enfants." },
      { h: "Modifications de cette politique", p: "Nous pouvons mettre à jour cette politique de temps en temps. La version la plus récente est toujours disponible à cette URL et dans l'application." },
      { h: "Contact", p: "Pour toute question relative à la confidentialité ou demande de données, veuillez nous contacter via l'annonce App Store." }

  de: {
    title: "UOKnow — Geht es dir jetzt gut?",
    subtitle: "Letzte Aktualisierung: Mai 2026",
    dir: "ltr",
    s: [
      { h: "Übersicht", p: "UOKnow („Geht es dir jetzt gut?“) ist eine persönliche Sicherheits-Check-in-App. Wenn du ein Check-in-Fenster verpasst, werden deine benannten Notfallkontakte benachrichtigt. Diese Richtlinie erklärt, welche Daten wir erheben, wie wir sie verwenden und welche Rechte du hast." },
      { h: "Erhobene Daten", p: "• Notfallkontaktinformationen – die Namen, E-Mail-Adressen und Telefonnummern, die du hinzufügst. Werden verschlüsselt auf deinem Gerät über iOS Keychain gespeichert.\n• Check-in-Zeitstempel – Datum und Uhrzeit jedes Check-ins.\n• Standort (optional) – wenn du die Standortfreigabe aktivierst, werden deine GPS-Koordinaten beim Check-in den Benachrichtigungen an deine Kontakte beigefügt. Der Standort wird nie im Hintergrund erfasst.\n• Gerätekennung – eine zufällig auf deinem Gerät lokal generierte ID. Sie ist nicht mit deinem Namen oder deiner Identität verknüpft." },
      { h: "Verwendung deiner Daten", p: "• Um Alarmbenachrichtigungen an deine Notfallkontakte zu senden, wenn ein Check-in ausbleibt.\n• Um tägliche Erinnerungs-Push-Benachrichtigungen auf deinem Gerät zu planen.\n• Um deinen Check-in-Verlauf in der App anzuzeigen." },
      { h: "Datenweitergabe", p: "Deine Notfallkontaktdaten und die Gerätekennung werden ausschließlich zur Ermöglichung der Alarmzustellung an unseren Server übertragen. Dein Standort (sofern aktiviert) wird in die Alarmmeldung aufgenommen, die an deine Kontakte gesendet wird.\n\nWir verkaufen, vermieten oder teilen deine Daten nicht mit Werbetreibenden, Analyseanbietern oder Dritten, soweit dies nicht zur Erbringung des Dienstes erforderlich ist." },
      { h: "Datenspeicherung & Sicherheit", p: "• Kontaktinformationen werden auf deinem Gerät mit iOS Keychain (expo-secure-store) verschlüsselt gespeichert.\n• Unser Server speichert nur die für die Zustellung von Benachrichtigungen minimal erforderlichen Daten.\n• Es werden keine Passwörter oder Authentifizierungsnachweise gespeichert." },
      { h: "Deine Rechte", p: "• Lösche alle App-Daten jederzeit über Einstellungen → Alle Daten zurücksetzen.\n• Deaktiviere die Standortfreigabe jederzeit in den Einstellungen.\n• Entferne Notfallkontakte jederzeit.\n• Für die Nutzung dieser App ist kein Konto oder keine Registrierung erforderlich." },
      { h: "Datenschutz für Kinder", p: "UOKnow richtet sich nicht an Kinder unter 13 Jahren. Wir erheben wissentlich keine Daten von Kindern." },
      { h: "Änderungen dieser Richtlinie", p: "Wir können diese Richtlinie von Zeit zu Zeit aktualisieren. Die neueste Version ist immer unter dieser URL und in der App verfügbar." },
      { h: "Kontakt", p: "Für datenschutzbezogene Fragen oder Datenanfragen wende dich bitte über das App Store-Listing an uns." }
    ]
  },

      { h: "Como usamos seus dados", p: "• Para enviar notificações de alerta aos seus contatos de emergência quando um check-in é perdido.\n• Para agendar notificações push de lembrete diário no seu dispositivo.\n• Para exibir seu histórico de check-in no aplicativo." },
      { h: "Compartilhamento de dados", p: "Os detalhes dos seus contatos de emergência e o identificador do dispositivo são transmitidos ao nosso servidor exclusivamente para permitir a entrega de alertas. Sua localização (se ativada) é incluída na mensagem de alerta enviada aos seus contatos.\n\nNão vendemos, alugamos nem compartilhamos seus dados com anunciantes, provedores de análise ou quaisquer terceiros além do necessário para fornecer o serviço." },
      { h: "Armazenamento e segurança", p: "• As informações de contato são criptografadas no seu dispositivo usando iOS Keychain (expo-secure-store).\n• Nosso servidor retém apenas os dados mínimos necessários para entregar notificações.\n• Nenhuma senha ou credencial de autenticação é armazenada." },
      { h: "Seus direitos", p: "• Exclua todos os dados do aplicativo a qualquer momento via Configurações → Redefinir todos os dados.\n• Desative o compartilhamento de localização a qualquer momento nas Configurações.\n• Remova contatos de emergência a qualquer momento.\n• Nenhuma conta ou registro é necessário para usar este aplicativo." },

      { h: "Alterações nesta política", p: "Podemos atualizar esta política periodicamente. A versão mais recente está sempre disponível nesta URL e no aplicativo." },
      { h: "Contato", p: "Para quaisquer dúvidas relacionadas à privacidade ou solicitações de dados, entre em contato conosco através da listagem da App Store." }

  ru: {
    title: "UOKnow — Сейчас всё хорошо?",
    subtitle: "Последнее обновление: май 2026 г.",
    dir: "ltr",
    s: [
      { h: "Обзор", p: "UOKnow («Сейчас всё хорошо?») — приложение для личной проверки безопасности. Если вы пропустили окно для отметки, ваши назначенные экстренные контакты получат уведомление. Эта политика объясняет, какие данные мы собираем, как их используем и каковы ваши права." },
      { h: "Собираемые данные", p: "• Информация об экстренных контактах — имена, адреса электронной почты и номера телефонов, которые вы добавляете. Хранятся в зашифрованном виде на устройстве через iOS Keychain.\n• Временны́е метки отметок — дата и время каждой выполненной отметки.\n• Местоположение (необязательно) — если вы включили общий доступ к местоположению, ваши GPS-координаты в момент отметки прикрепляются к уведомлениям, отправляемым контактам. Местоположение никогда не собирается в фоновом режиме.\n• Идентификатор устройства — случайный идентификатор, сгенерированный локально на вашем устройстве. Он не связан с вашим именем или личностью." },
      { h: "Использование данных", p: "• Для отправки уведомлений-предупреждений вашим экстренным контактам при пропуске отметки.\n• Для планирования ежедневных напоминаний в виде push-уведомлений на вашем устройстве.\n• Для отображения истории отметок в приложении." },
      { h: "Передача данных", p: "Данные ваших экстренных контактов и идентификатор устройства передаются на наш сервер исключительно для обеспечения доставки уведомлений. Ваше местоположение (если включено) включается в сообщение-предупреждение, отправляемое вашим контактам.\n\nМы не продаём, не сдаём в аренду и не передаём ваши данные рекламодателям, аналитическим провайдерам или третьим лицам сверх того, что необходимо для предоставления услуги." },
      { h: "Хранение данных и безопасность", p: "• Информация о контактах зашифрована на вашем устройстве с помощью iOS Keychain (expo-secure-store).\n• Наш сервер хранит только минимально необходимые для доставки уведомлений данные.\n• Пароли и учётные данные для аутентификации не хранятся." },
      { h: "Ваши права", p: "• Удалите все данные приложения в любое время через «Настройки → Сбросить все данные».\n• Отключите общий доступ к местоположению в любое время в «Настройках».\n• Удалите экстренные контакты в любое время.\n• Для использования приложения не требуется учётная запись или регистрация." },
      { h: "Конфиденциальность детей", p: "UOKnow не предназначено для детей до 13 лет. Мы сознательно не собираем данные детей." },
      { h: "Изменения в политике", p: "Мы можем периодически обновлять эту политику. Последняя версия всегда доступна по этому URL-адресу и в приложении." },
      { h: "Контакт", p: "По любым вопросам конфиденциальности или запросам данных свяжитесь с нами через листинг в App Store." }
    ]
  },
  ar: {
    title: "UOKnow — هل أنت بخير الآن؟",
    subtitle: "آخر تحديث: مايو 2026",
    dir: "rtl",
    s: [
      { h: "نظرة عامة", p: "UOKnow (\"هل أنت بخير الآن؟\") تطبيق للتحقق من السلامة الشخصية. عند فوات نافذة تسجيل الحضور، يتلقى جهات الاتصال الطارئة المعيّنة إشعاراً. توضح هذه السياسة البيانات التي نجمعها وكيفية استخدامها وحقوقك." },
      { h: "البيانات التي نجمعها", p: "• معلومات جهات الاتصال الطارئة – الأسماء وعناوين البريد الإلكتروني وأرقام الهاتف التي تضيفها. يتم تخزينها مشفّرةً على جهازك عبر iOS Keychain.\n• طوابع وقت تسجيل الحضور – تاريخ ووقت كل تسجيل حضور تُجريه.\n• الموقع الجغرافي (اختياري) – إذا فعّلت مشاركة الموقع، فسيتم إرفاق إحداثيات GPS وقت تسجيل الحضور بالتنبيهات المرسلة لجهات اتصالك. لا يُجمع الموقع مطلقاً في الخلفية.\n• معرّف الجهاز – معرّف عشوائي يتم توليده محلياً على جهازك، ولا يرتبط باسمك أو هويتك." },
      { h: "كيف نستخدم بياناتك", p: "• لإرسال إشعارات تنبيه إلى جهات اتصالك الطارئة عند تفويت تسجيل الحضور.\n• لجدولة إشعارات دفع تذكيرية يومية على جهازك.\n• لعرض سجل تسجيلات الحضور داخل التطبيق." },
      { h: "مشاركة البيانات", p: "يتم نقل بيانات جهات اتصالك الطارئة ومعرّف جهازك إلى خادمنا فقط لتمكين تسليم التنبيهات. يتم تضمين موقعك الجغرافي (إن كان مفعّلاً) في رسالة التنبيه المرسلة إلى جهات اتصالك.\n\nلا نبيع بياناتك أو نؤجّرها أو نشاركها مع المعلنين أو مزوّدي التحليلات أو أي أطراف ثالثة خارج ما هو ضروري لتقديم الخدمة." },
      { h: "تخزين البيانات والأمان", p: "• يتم تشفير معلومات الاتصال على جهازك باستخدام iOS Keychain (expo-secure-store).\n• يحتفظ خادمنا فقط بالحد الأدنى من البيانات اللازمة لتسليم الإشعارات.\n• لا يتم تخزين أي كلمات مرور أو بيانات اعتماد للمصادقة." },
      { h: "حقوقك", p: "• احذف جميع بيانات التطبيق في أي وقت عبر الإعدادات ← إعادة تعيين جميع البيانات.\n• عطّل مشاركة الموقع في أي وقت من الإعدادات.\n• أزل جهات الاتصال الطارئة في أي وقت.\n• لا يلزم وجود حساب أو تسجيل لاستخدام هذا التطبيق." },
      { h: "خصوصية الأطفال", p: "لا يستهدف UOKnow الأطفال دون سن 13. لا نجمع بيانات الأطفال عن قصد." },
      { h: "التغييرات على هذه السياسة", p: "قد نحدّث هذه السياسة من وقت لآخر. تتوفر أحدث نسخة دائماً على هذا الرابط وداخل التطبيق." },
      { h: "التواصل", p: "لأي استفسارات تتعلق بالخصوصية أو طلبات البيانات، يرجى التواصل معنا عبر قائمة App Store." }
    ]
  },

    s: [
      { h: "अवलोकन", p: "UOKnow (\"क्या आप अभी ठीक हैं?\") एक व्यक्तिगत सुरक्षा चेक-इन ऐप है। जब आप निर्धारित समय सीमा में चेक-इन नहीं करते, तो आपके नामांकित आपातकालीन संपर्कों को सूचित किया जाता है। यह नीति बताती है कि हम कौन सा डेटा एकत्र करते हैं, उसका उपयोग कैसे करते हैं और आपके अधिकार क्या हैं।" },
      { h: "हम जो डेटा एकत्र करते हैं", p: "• आपातकालीन संपर्क जानकारी – आपके द्वारा जोड़े गए नाम, ईमेल पते और फ़ोन नंबर। iOS Keychain के माध्यम से आपके डिवाइस पर एन्क्रिप्टेड रूप में संग्रहीत।\n• चेक-इन टाइमस्टैम्प – आपके द्वारा दर्ज किए गए प्रत्येक चेक-इन की तारीख और समय।\n• स्थान (वैकल्पिक) – यदि आप स्थान साझाकरण सक्षम करते हैं, तो चेक-इन के समय आपके GPS निर्देशांक आपके संपर्कों को भेजे गए अलर्ट से संलग्न होते हैं। स्थान कभी भी पृष्ठभूमि में एकत्र नहीं किया जाता।\n• डिवाइस पहचानकर्ता – आपके डिवाइस पर स्थानीय रूप से उत्पन्न एक यादृच्छिक ID। यह आपके नाम या पहचान से जुड़ा नहीं है।" },
      { h: "हम आपके डेटा का उपयोग कैसे करते हैं", p: "• चेक-इन छूट जाने पर आपके आपातकालीन संपर्कों को अलर्ट अधिसूचना भेजने के लिए।\n• आपके डिवाइस पर दैनिक रिमाइंडर पुश नोटिफिकेशन शेड्यूल करने के लिए।\n• ऐप के भीतर आपके चेक-इन इतिहास को प्रदर्शित करने के लिए।" },
      { h: "डेटा साझाकरण", p: "आपके आपातकालीन संपर्क विवरण और डिवाइस पहचानकर्ता केवल अलर्ट डिलीवरी सक्षम करने के लिए हमारे सर्वर पर प्रेषित किए जाते हैं। आपका स्थान (यदि सक्षम है) आपके संपर्कों को भेजे गए अलर्ट संदेश में शामिल होता है।\n\nहम आपका डेटा विज्ञापनदाताओं, विश्लेषण प्रदाताओं या किसी भी तृतीय पक्ष को सेवा प्रदान करने के लिए आवश्यक से परे नहीं बेचते, किराए पर देते या साझा करते हैं।" },
      { h: "डेटा संग्रहण और सुरक्षा", p: "• संपर्क जानकारी iOS Keychain (expo-secure-store) का उपयोग करके आपके डिवाइस पर एन्क्रिप्ट की गई है।\n• हमारा सर्वर केवल अधिसूचनाएं देने के लिए न्यूनतम आवश्यक डेटा रखता है।\n• कोई पासवर्ड या प्रमाणीकरण क्रेडेंशियल संग्रहीत नहीं किए जाते।" },
      { h: "आपके अधिकार", p: "• कभी भी सेटिंग्स → सभी डेटा रीसेट करें के माध्यम से सभी ऐप डेटा हटाएं।\n• कभी भी सेटिंग्स में स्थान साझाकरण अक्षम करें।\n• कभी भी आपातकालीन संपर्क हटाएं।\n• इस ऐप का उपयोग करने के लिए कोई खाता या पंजीकरण आवश्यक नहीं है।" },
      { h: "बच्चों की गोपनीयता", p: "UOKnow 13 वर्ष से कम आयु के बच्चों के लिए नहीं है। हम जानबूझकर बच्चों से डेटा एकत्र नहीं करते।" },
      { h: "इस नीति में बदलाव", p: "हम समय-समय पर इस नीति को अपडेट कर सकते हैं। नवीनतम संस्करण हमेशा इस URL और ऐप के भीतर उपलब्ध है।" },
      { h: "संपर्क", p: "किसी भी गोपनीयता संबंधित प्रश्नों या डेटा अनुरोधों के लिए, कृपया App Store लिस्टिंग के माध्यम से हमसे संपर्क करें।" }
    ]
  },
  th: {
    title: "UOKnow — คุณสบายดีไหมตอนนี้?",
    subtitle: "อัปเดตล่าสุด: พฤษภาคม 2026",
    dir: "ltr",
    s: [
      { h: "ภาพรวม", p: "UOKnow (\"คุณสบายดีไหมตอนนี้?\") เป็นแอปเช็คอินความปลอดภัยส่วนบุคคล เมื่อคุณไม่ได้เช็คอินภายในช่วงเวลาที่กำหนด ผู้ติดต่อฉุกเฉินที่คุณระบุจะได้รับการแจ้งเตือน นโยบายนี้อธิบายข้อมูลที่เราเก็บรวบรวม วิธีการใช้งาน และสิทธิ์ของคุณ" },
      { h: "ข้อมูลที่เราเก็บรวบรวม", p: "• ข้อมูลผู้ติดต่อฉุกเฉิน – ชื่อ ที่อยู่อีเมล และหมายเลขโทรศัพท์ที่คุณเพิ่ม จัดเก็บแบบเข้ารหัสบนอุปกรณ์ของคุณผ่าน iOS Keychain\n• การประทับเวลาเช็คอิน – วันที่และเวลาของการเช็คอินแต่ละครั้งที่คุณบันทึก\n• ตำแหน่ง (ไม่บังคับ) – หากคุณเปิดใช้งานการแชร์ตำแหน่ง พิกัด GPS ณ เวลาเช็คอินจะถูกแนบไปกับการแจ้งเตือนที่ส่งถึงผู้ติดต่อของคุณ ตำแหน่งจะไม่ถูกเก็บรวบรวมในพื้นหลังเด็ดขาด\n• ตัวระบุอุปกรณ์ – รหัสสุ่มที่สร้างในเครื่องบนอุปกรณ์ของคุณ ไม่เชื่อมโยงกับชื่อหรือตัวตนของคุณ" },
      { h: "วิธีที่เราใช้ข้อมูลของคุณ", p: "• เพื่อส่งการแจ้งเตือนเตือนภัยไปยังผู้ติดต่อฉุกเฉินของคุณเมื่อพลาดการเช็คอิน\n• เพื่อกำหนดเวลาการแจ้งเตือนพุชเตือนความจำรายวันบนอุปกรณ์ของคุณ\n• เพื่อแสดงประวัติการเช็คอินของคุณภายในแอป" },
      { h: "การแชร์ข้อมูล", p: "รายละเอียดผู้ติดต่อฉุกเฉินและตัวระบุอุปกรณ์ของคุณจะถูกส่งไปยังเซิร์ฟเวอร์ของเราเฉพาะเพื่อให้การส่งการแจ้งเตือนทำงานได้ ตำแหน่งของคุณ (หากเปิดใช้งาน) จะรวมอยู่ในข้อความแจ้งเตือนที่ส่งถึงผู้ติดต่อของคุณ\n\nเราไม่ขาย ให้เช่า หรือแบ่งปันข้อมูลของคุณกับผู้ลงโฆษณา ผู้ให้บริการวิเคราะห์ หรือบุคคลที่สามใด ๆ เกินกว่าที่จำเป็นสำหรับการให้บริการ" },
      { h: "การจัดเก็บข้อมูลและความปลอดภัย", p: "• ข้อมูลผู้ติดต่อถูกเข้ารหัสบนอุปกรณ์ของคุณโดยใช้ iOS Keychain (expo-secure-store)\n• เซิร์ฟเวอร์ของเราเก็บเฉพาะข้อมูลขั้นต่ำที่จำเป็นสำหรับการส่งการแจ้งเตือนเท่านั้น\n• ไม่มีการจัดเก็บรหัสผ่านหรือข้อมูลประจำตัวสำหรับการตรวจสอบสิทธิ์" },
      { h: "สิทธิ์ของคุณ", p: "• ลบข้อมูลแอปทั้งหมดได้ตลอดเวลาผ่าน การตั้งค่า → รีเซ็ตข้อมูลทั้งหมด\n• ปิดใช้งานการแชร์ตำแหน่งได้ตลอดเวลาในการตั้งค่า\n• ลบผู้ติดต่อฉุกเฉินได้ตลอดเวลา\n• ไม่จำเป็นต้องมีบัญชีหรือการลงทะเบียนเพื่อใช้แอปนี้" },
      { h: "ความเป็นส่วนตัวของเด็ก", p: "UOKnow ไม่ได้มุ่งเป้าไปที่เด็กอายุต่ำกว่า 13 ปี เราไม่เก็บรวบรวมข้อมูลจากเด็กโดยเจตนา" },
      { h: "การเปลี่ยนแปลงนโยบายนี้", p: "เราอาจอัปเดตนโยบายนี้เป็นครั้งคราว เวอร์ชันล่าสุดมีอยู่เสมอที่ URL นี้และภายในแอป" },
      { h: "ติดต่อ", p: "สำหรับคำถามที่เกี่ยวข้องกับความเป็นส่วนตัวหรือคำขอข้อมูล โปรดติดต่อเราผ่านรายชื่อ App Store" }
    ]
  },
  vi: {
    title: "UOKnow — Bạn có ổn không bây giờ?",
    subtitle: "Cập nhật lần cuối: Tháng 5 năm 2026",
    dir: "ltr",
    s: [
      { h: "Tổng quan", p: "UOKnow (\"Bạn có ổn không bây giờ?\") là ứng dụng check-in an toàn cá nhân. Khi bạn bỏ lỡ cửa sổ check-in, các liên hệ khẩn cấp được chỉ định của bạn sẽ được thông báo. Chính sách này giải thích dữ liệu chúng tôi thu thập, cách chúng tôi sử dụng và quyền của bạn." },
      { h: "Dữ liệu chúng tôi thu thập", p: "• Thông tin liên hệ khẩn cấp – tên, địa chỉ email và số điện thoại bạn thêm vào. Được lưu trữ mã hóa trên thiết bị của bạn qua iOS Keychain.\n• Dấu thời gian check-in – ngày và giờ của mỗi lần check-in bạn ghi lại.\n• Vị trí (tùy chọn) – nếu bạn bật chia sẻ vị trí, tọa độ GPS của bạn vào thời điểm check-in sẽ được đính kèm vào cảnh báo gửi cho các liên hệ. Vị trí không bao giờ được thu thập trong nền.\n• Mã nhận dạng thiết bị – ID ngẫu nhiên được tạo cục bộ trên thiết bị của bạn. Nó không được liên kết với tên hoặc danh tính của bạn." },
      { h: "Cách chúng tôi sử dụng dữ liệu của bạn", p: "• Để gửi thông báo cảnh báo đến các liên hệ khẩn cấp của bạn khi bỏ lỡ check-in.\n• Để lên lịch thông báo đẩy nhắc nhở hàng ngày trên thiết bị của bạn.\n• Để hiển thị lịch sử check-in của bạn trong ứng dụng." },
      { h: "Chia sẻ dữ liệu", p: "Thông tin liên hệ khẩn cấp và mã nhận dạng thiết bị của bạn được truyền đến máy chủ của chúng tôi chỉ để cho phép gửi cảnh báo. Vị trí của bạn (nếu được bật) được đưa vào tin nhắn cảnh báo gửi đến các liên hệ của bạn.\n\nChúng tôi không bán, cho thuê hoặc chia sẻ dữ liệu của bạn với các nhà quảng cáo, nhà cung cấp dịch vụ phân tích hoặc bất kỳ bên thứ ba nào ngoài những gì cần thiết để cung cấp dịch vụ." },
      { h: "Lưu trữ dữ liệu & Bảo mật", p: "• Thông tin liên hệ được mã hóa trên thiết bị của bạn bằng iOS Keychain (expo-secure-store).\n• Máy chủ của chúng tôi chỉ lưu giữ dữ liệu tối thiểu cần thiết để gửi thông báo.\n• Không có mật khẩu hoặc thông tin xác thực nào được lưu trữ." },
      { h: "Quyền của bạn", p: "• Xóa tất cả dữ liệu ứng dụng bất cứ lúc nào qua Cài đặt → Đặt lại tất cả dữ liệu.\n• Tắt chia sẻ vị trí bất cứ lúc nào trong Cài đặt.\n• Xóa liên hệ khẩn cấp bất cứ lúc nào.\n• Không cần tài khoản hay đăng ký để sử dụng ứng dụng này." },
      { h: "Quyền riêng tư của trẻ em", p: "UOKnow không hướng đến trẻ em dưới 13 tuổi. Chúng tôi không cố ý thu thập dữ liệu từ trẻ em." },
      { h: "Thay đổi chính sách này", p: "Chúng tôi có thể cập nhật chính sách này theo thời gian. Phiên bản mới nhất luôn có sẵn tại URL này và trong ứng dụng." },
      { h: "Liên hệ", p: "Đối với bất kỳ câu hỏi liên quan đến quyền riêng tư hoặc yêu cầu dữ liệu, vui lòng liên hệ với chúng tôi qua danh sách App Store." }
    ]
  },
  id: {
    title: "UOKnow — Apakah kamu baik-baik saja sekarang?",
    subtitle: "Terakhir diperbarui: Mei 2026",
    dir: "ltr",
    s: [
      { h: "Ikhtisar", p: "UOKnow (\"Apakah kamu baik-baik saja sekarang?\") adalah aplikasi check-in keamanan pribadi. Ketika kamu melewatkan jendela check-in, kontak darurat yang kamu tunjuk akan diberitahu. Kebijakan ini menjelaskan data apa yang kami kumpulkan, cara kami menggunakannya, dan hak-hakmu." },
      { h: "Data yang Kami Kumpulkan", p: "• Informasi kontak darurat – nama, alamat email, dan nomor telepon yang kamu tambahkan. Disimpan terenkripsi di perangkatmu melalui iOS Keychain.\n• Stempel waktu check-in – tanggal dan waktu setiap check-in yang kamu catat.\n• Lokasi (opsional) – jika kamu mengaktifkan berbagi lokasi, koordinat GPS-mu saat check-in akan dilampirkan ke peringatan yang dikirim ke kontakmu. Lokasi tidak pernah dikumpulkan di latar belakang.\n• Pengenal perangkat – ID acak yang dibuat secara lokal di perangkatmu. Tidak terhubung dengan nama atau identitasmu." },
      { h: "Cara Kami Menggunakan Datamu", p: "• Untuk mengirim notifikasi peringatan ke kontak daruratmu saat check-in terlewat.\n• Untuk menjadwalkan notifikasi push pengingat harian di perangkatmu.\n• Untuk menampilkan riwayat check-in di dalam aplikasi." },
      { h: "Berbagi Data", p: "Detail kontak darurat dan pengenal perangkatmu dikirimkan ke server kami hanya untuk memungkinkan pengiriman peringatan. Lokasimu (jika diaktifkan) disertakan dalam pesan peringatan yang dikirim ke kontakmu.\n\nKami tidak menjual, menyewakan, atau berbagi datamu dengan pengiklan, penyedia analitik, atau pihak ketiga mana pun di luar yang diperlukan untuk memberikan layanan." },
      { h: "Penyimpanan & Keamanan Data", p: "• Informasi kontak dienkripsi di perangkatmu menggunakan iOS Keychain (expo-secure-store).\n• Server kami hanya menyimpan data minimum yang diperlukan untuk mengirimkan notifikasi.\n• Tidak ada kata sandi atau kredensial autentikasi yang disimpan." },
      { h: "Hak-hakmu", p: "• Hapus semua data aplikasi kapan saja melalui Pengaturan → Reset Semua Data.\n• Nonaktifkan berbagi lokasi kapan saja di Pengaturan.\n• Hapus kontak darurat kapan saja.\n• Tidak diperlukan akun atau registrasi untuk menggunakan aplikasi ini." },
      { h: "Privasi Anak-anak", p: "UOKnow tidak ditujukan untuk anak-anak di bawah 13 tahun. Kami tidak secara sengaja mengumpulkan data dari anak-anak." },
      { h: "Perubahan Kebijakan Ini", p: "Kami mungkin memperbarui kebijakan ini dari waktu ke waktu. Versi terbaru selalu tersedia di URL ini dan di dalam aplikasi." },
      { h: "Kontak", p: "Untuk pertanyaan terkait privasi atau permintaan data, silakan hubungi kami melalui daftar App Store." }
    ]
  },
  ms: {
    title: "UOKnow — Adakah anda baik-baik saja sekarang?",
    subtitle: "Kemaskini terakhir: Mei 2026",
    dir: "ltr",
    s: [
      { h: "Gambaran Keseluruhan", p: "UOKnow (\"Adakah anda baik-baik saja sekarang?\") ialah aplikasi daftar masuk keselamatan peribadi. Apabila anda terlepas tetingkap daftar masuk, kenalan kecemasan yang anda namakan akan dimaklumkan. Polisi ini menerangkan data yang kami kumpulkan, cara kami menggunakannya, dan hak-hak anda." },
      { h: "Data yang Kami Kumpulkan", p: "• Maklumat kenalan kecemasan – nama, alamat e-mel, dan nombor telefon yang anda tambah. Disimpan secara disulitkan pada peranti anda melalui iOS Keychain.\n• Cap masa daftar masuk – tarikh dan masa setiap daftar masuk yang anda rekodkan.\n• Lokasi (pilihan) – jika anda mendayakan perkongsian lokasi, koordinat GPS anda pada masa daftar masuk dilampirkan pada amaran yang dihantar kepada kenalan anda. Lokasi tidak pernah dikumpulkan di latar belakang.\n• Pengecam peranti – ID rawak yang dijana secara tempatan pada peranti anda. Ia tidak dikaitkan dengan nama atau identiti anda." },
      { h: "Cara Kami Menggunakan Data Anda", p: "• Untuk menghantar pemberitahuan amaran kepada kenalan kecemasan anda apabila daftar masuk terlepas.\n• Untuk menjadualkan pemberitahuan tolak peringatan harian pada peranti anda.\n• Untuk memaparkan sejarah daftar masuk anda dalam aplikasi." },
      { h: "Perkongsian Data", p: "Butiran kenalan kecemasan dan pengecam peranti anda dihantar ke pelayan kami semata-mata untuk membolehkan penghantaran amaran. Lokasi anda (jika didayakan) disertakan dalam mesej amaran yang dihantar kepada kenalan anda.\n\nKami tidak menjual, menyewa atau berkongsi data anda dengan pengiklan, pembekal analitik, atau mana-mana pihak ketiga melebihi apa yang diperlukan untuk menyampaikan perkhidmatan." },
      { h: "Penyimpanan & Keselamatan Data", p: "• Maklumat kenalan disulitkan pada peranti anda menggunakan iOS Keychain (expo-secure-store).\n• Pelayan kami hanya menyimpan data minimum yang diperlukan untuk menghantar pemberitahuan.\n• Tiada kata laluan atau bukti kelayakan pengesahan yang disimpan." },
      { h: "Hak-hak Anda", p: "• Padamkan semua data aplikasi pada bila-bila masa melalui Tetapan → Tetapkan Semula Semua Data.\n• Nyahdayakan perkongsian lokasi pada bila-bila masa dalam Tetapan.\n• Alih keluar kenalan kecemasan pada bila-bila masa.\n• Tiada akaun atau pendaftaran diperlukan untuk menggunakan aplikasi ini." },
      { h: "Privasi Kanak-kanak", p: "UOKnow tidak ditujukan kepada kanak-kanak bawah 13 tahun. Kami tidak mengumpulkan data daripada kanak-kanak secara sengaja." },
      { h: "Perubahan pada Polisi Ini", p: "Kami mungkin mengemas kini polisi ini dari semasa ke semasa. Versi terbaru sentiasa tersedia di URL ini dan dalam aplikasi." },
      { h: "Hubungi Kami", p: "Untuk sebarang pertanyaan berkaitan privasi atau permintaan data, sila hubungi kami melalui penyenaraian App Store." }
    ]
  },
  nl: {
    title: "UOKnow — Gaat het nu goed?",
    subtitle: "Laatste update: mei 2026",
    dir: "ltr",
    s: [
      { h: "Overzicht", p: "UOKnow (\"Gaat het nu goed?\") is een persoonlijke veiligheids-check-in-app. Wanneer je een check-in-venster mist, worden je aangewezen noodcontacten op de hoogte gesteld. Dit beleid legt uit welke gegevens we verzamelen, hoe we ze gebruiken en wat jouw rechten zijn." },
      { h: "Gegevens die we verzamelen", p: "• Informatie over noodcontacten – de namen, e-mailadressen en telefoonnummers die je toevoegt. Versleuteld opgeslagen op je apparaat via iOS Keychain.\n• Check-in-tijdstempels – de datum en tijd van elke check-in die je registreert.\n• Locatie (optioneel) – als je locatiedeling inschakelt, worden je GPS-coördinaten op het moment van check-in bijgevoegd aan de meldingen die naar je contacten worden gestuurd. Locatie wordt nooit op de achtergrond verzameld.\n• Apparaat-ID – een willekeurig ID dat lokaal op je apparaat wordt gegenereerd. Het is niet gekoppeld aan je naam of identiteit." },
      { h: "Hoe we je gegevens gebruiken", p: "• Om waarschuwingsmeldingen te sturen naar je noodcontacten wanneer een check-in wordt gemist.\n• Om dagelijkse herinneringspush-meldingen op je apparaat te plannen.\n• Om je check-in-geschiedenis in de app te tonen." },
      { h: "Gegevens delen", p: "De contactgegevens van je noodcontacten en de apparaat-ID worden uitsluitend verzonden naar onze server om de bezorging van waarschuwingen mogelijk te maken. Je locatie (indien ingeschakeld) is opgenomen in het waarschuwingsbericht dat naar je contacten wordt gestuurd.\n\nWe verkopen, verhuren of delen je gegevens niet met adverteerders, analyseproviders of derden buiten hetgeen noodzakelijk is om de dienst te leveren." },
      { h: "Gegevensopslag & Beveiliging", p: "• Contactinformatie is versleuteld op je apparaat met iOS Keychain (expo-secure-store).\n• Onze server bewaart alleen de minimaal noodzakelijke gegevens om meldingen te bezorgen.\n• Er worden geen wachtwoorden of authenticatiereferenties opgeslagen." },
      { h: "Jouw rechten", p: "• Verwijder alle app-gegevens op elk moment via Instellingen → Alle gegevens resetten.\n• Schakel locatiedeling op elk moment uit in Instellingen.\n• Verwijder noodcontacten op elk moment.\n• Er is geen account of registratie vereist om deze app te gebruiken." },
      { h: "Privacy van kinderen", p: "UOKnow is niet gericht op kinderen onder de 13 jaar. We verzamelen niet bewust gegevens van kinderen." },
      { h: "Wijzigingen in dit beleid", p: "We kunnen dit beleid van tijd tot tijd bijwerken. De nieuwste versie is altijd beschikbaar op deze URL en in de app." },
      { h: "Contact", p: "Voor privacygerelateerde vragen of gegevensverzoeken kunt u contact met ons opnemen via de App Store-vermelding." }
    ]
  },
  pl: {
    title: "UOKnow — Czy teraz wszystko dobrze?",
    subtitle: "Ostatnia aktualizacja: maj 2026",
    dir: "ltr",
    s: [
      { h: "Przegląd", p: "UOKnow (\"Czy teraz wszystko dobrze?\") to aplikacja do osobistego check-inu bezpieczeństwa. Gdy przegapisz okno check-inu, Twoje wyznaczone kontakty alarmowe zostaną powiadomione. Niniejsza polityka wyjaśnia, jakie dane gromadzimy, jak je wykorzystujemy i jakie masz prawa." },
      { h: "Zbierane dane", p: "• Informacje o kontaktach alarmowych – imiona i nazwiska, adresy e-mail oraz numery telefonów, które dodajesz. Przechowywane w zaszyfrowanej formie na Twoim urządzeniu za pomocą iOS Keychain.\n• Znaczniki czasu check-inu – data i godzina każdego zarejestrowanego check-inu.\n• Lokalizacja (opcjonalnie) – jeśli włączysz udostępnianie lokalizacji, Twoje współrzędne GPS w momencie check-inu zostaną dołączone do alertów wysłanych do Twoich kontaktów. Lokalizacja nigdy nie jest zbierana w tle.\n• Identyfikator urządzenia – losowy identyfikator generowany lokalnie na Twoim urządzeniu. Nie jest powiązany z Twoim imieniem ani tożsamością." },
      { h: "Jak wykorzystujemy Twoje dane", p: "• Aby wysyłać powiadomienia o alertach do Twoich kontaktów alarmowych, gdy check-in zostanie pominięty.\n• Aby planować codzienne przypomnienia w postaci powiadomień push na Twoim urządzeniu.\n• Aby wyświetlać historię check-inów w aplikacji." },
      { h: "Udostępnianie danych", p: "Dane Twoich kontaktów alarmowych oraz identyfikator urządzenia są przesyłane na nasz serwer wyłącznie w celu umożliwienia dostarczenia alertów. Twoja lokalizacja (jeśli włączona) jest uwzględniona w wiadomości alertowej wysłanej do Twoich kontaktów.\n\nNie sprzedajemy, nie wynajmujemy ani nie udostępniamy Twoich danych reklamodawcom, dostawcom analityki ani żadnym osobom trzecim poza zakresem niezbędnym do świadczenia usługi." },
      { h: "Przechowywanie danych i bezpieczeństwo", p: "• Informacje kontaktowe są zaszyfrowane na Twoim urządzeniu przy użyciu iOS Keychain (expo-secure-store).\n• Nasz serwer przechowuje tylko minimalne dane niezbędne do dostarczania powiadomień.\n• Żadne hasła ani dane uwierzytelniające nie są przechowywane." },
      { h: "Twoje prawa", p: "• Usuń wszystkie dane aplikacji w dowolnym momencie przez Ustawienia → Zresetuj wszystkie dane.\n• Wyłącz udostępnianie lokalizacji w dowolnym momencie w Ustawieniach.\n• Usuń kontakty alarmowe w dowolnym momencie.\n• Korzystanie z tej aplikacji nie wymaga konta ani rejestracji." },
      { h: "Prywatność dzieci", p: "UOKnow nie jest kierowane do dzieci poniżej 13 roku życia. Nie gromadzimy świadomie danych od dzieci." },
      { h: "Zmiany w polityce", p: "Możemy od czasu do czasu aktualizować tę politykę. Najnowsza wersja jest zawsze dostępna pod tym adresem URL i w aplikacji." },
      { h: "Kontakt", p: "W przypadku pytań dotyczących prywatności lub żądań dotyczących danych prosimy o kontakt za pośrednictwem wpisu w App Store." }
    ]
  },
  tr: {
    title: "UOKnow — Şu an iyi misin?",
    subtitle: "Son güncelleme: Mayıs 2026",
    dir: "ltr",
    s: [
      { h: "Genel Bakış", p: "UOKnow (\"Şu an iyi misin?\"), kişisel güvenlik kontrol uygulamasıdır. Belirlenen zaman diliminde kontrol yapmazsanız, belirlediğiniz acil kişiler bilgilendirilir. Bu politika, topladığımız verileri, bunları nasıl kullandığımızı ve haklarınızı açıklar." },
      { h: "Topladığımız Veriler", p: "• Acil kişi bilgileri – eklediğiniz adlar, e-posta adresleri ve telefon numaraları. iOS Keychain aracılığıyla cihazınızda şifrelenmiş olarak saklanır.\n• Kontrol zaman damgaları – kaydettiğiniz her kontrolün tarihi ve saati.\n• Konum (isteğe bağlı) – konum paylaşımını etkinleştirirseniz, kontrol sırasındaki GPS koordinatlarınız kişilerinize gönderilen uyarılara eklenir. Konum hiçbir zaman arka planda toplanmaz.\n• Cihaz tanımlayıcısı – cihazınızda yerel olarak oluşturulan rastgele bir kimlik. Adınızla veya kimliğinizle bağlantılı değildir." },
      { h: "Verilerinizi Nasıl Kullanıyoruz", p: "• Kontrol kaçırıldığında acil kişilerinize uyarı bildirimleri göndermek için.\n• Cihazınızda günlük hatırlatma bildirimleri planlamak için.\n• Uygulama içinde kontrol geçmişinizi görüntülemek için." },
      { h: "Veri Paylaşımı", p: "Acil kişi bilgileriniz ve cihaz tanımlayıcınız yalnızca uyarıların iletilmesini sağlamak amacıyla sunucumuza iletilir. Konumunuz (etkinleştirilmişse) kişilerinize gönderilen uyarı mesajına dahil edilir.\n\nVerilerinizi reklamcılara, analiz sağlayıcılarına veya hizmetin sunulması için gerekli olanın ötesinde üçüncü taraflara satmıyor, kiralamıyor veya paylaşmıyoruz." },
      { h: "Veri Depolama ve Güvenlik", p: "• Kişi bilgileri iOS Keychain (expo-secure-store) kullanılarak cihazınızda şifrelenir.\n• Sunucumuz yalnızca bildirimlerin iletilmesi için gereken minimum verileri saklar.\n• Hiçbir parola veya kimlik doğrulama bilgisi saklanmaz." },
      { h: "Haklarınız", p: "• Ayarlar → Tüm Verileri Sıfırla yoluyla istediğiniz zaman tüm uygulama verilerini silin.\n• Ayarlar'dan istediğiniz zaman konum paylaşımını devre dışı bırakın.\n• İstediğiniz zaman acil kişileri kaldırın.\n• Bu uygulamayı kullanmak için hesap veya kayıt gerekmez." },
      { h: "Çocukların Gizliliği", p: "UOKnow, 13 yaşın altındaki çocuklara yönelik değildir. Bilerek çocuklardan veri toplamıyoruz." },
      { h: "Bu Politikadaki Değişiklikler", p: "Bu politikayı zaman zaman güncelleyebiliriz. En son sürüm her zaman bu URL'de ve uygulamada mevcuttur." },
      { h: "İletişim", p: "Gizlilikle ilgili sorular veya veri talepleri için lütfen App Store girişi aracılığıyla bizimle iletişime geçin." }
    ]
  },
  uk: {
    title: "UOKnow — Ти зараз в порядку?",
    subtitle: "Останнє оновлення: травень 2026 р.",
    dir: "ltr",
    s: [
      { h: "Огляд", p: "UOKnow («Ти зараз в порядку?») — застосунок для особистих перевірок безпеки. Якщо ви пропустили вікно відмітки, ваші призначені екстрені контакти отримають сповіщення. Ця політика пояснює, які дані ми збираємо, як їх використовуємо та які у вас права." },
      { h: "Дані, які ми збираємо", p: "• Інформація про екстрені контакти – імена, адреси електронної пошти та номери телефонів, які ви додаєте. Зберігаються у зашифрованому вигляді на вашому пристрої через iOS Keychain.\n• Мітки часу відміток – дата та час кожної здійсненої відмітки.\n• Місцезнаходження (необов'язково) – якщо ви ввімкнули спільний доступ до місцезнаходження, ваші GPS-координати під час відмітки додаються до сповіщень, що надсилаються контактам. Місцезнаходження ніколи не збирається у фоновому режимі.\n• Ідентифікатор пристрою – випадковий ідентифікатор, згенерований локально на вашому пристрої. Він не пов'язаний з вашим ім'ям або особистістю." },
      { h: "Як ми використовуємо ваші дані", p: "• Для надсилання сповіщень-попереджень вашим екстреним контактам у разі пропуску відмітки.\n• Для планування щоденних нагадувань у вигляді push-сповіщень на вашому пристрої.\n• Для відображення історії відміток у застосунку." },
      { h: "Передача даних", p: "Дані ваших екстрених контактів та ідентифікатор пристрою передаються на наш сервер виключно для забезпечення доставки сповіщень. Ваше місцезнаходження (якщо ввімкнено) включається до повідомлення-попередження, що надсилається вашим контактам.\n\nМи не продаємо, не здаємо в оренду та не передаємо ваші дані рекламодавцям, аналітичним провайдерам або третім особам понад те, що необхідно для надання послуги." },
      { h: "Зберігання даних і безпека", p: "• Контактна інформація зашифрована на вашому пристрої за допомогою iOS Keychain (expo-secure-store).\n• Наш сервер зберігає лише мінімально необхідні дані для доставки сповіщень.\n• Паролі та облікові дані для аутентифікації не зберігаються." },
      { h: "Ваші права", p: "• Видаліть усі дані застосунку будь-коли через «Налаштування → Скинути всі дані».\n• Вимкніть спільний доступ до місцезнаходження будь-коли в «Налаштуваннях».\n• Видаліть екстрені контакти будь-коли.\n• Для використання цього застосунку не потрібен обліковий запис або реєстрація." },
      { h: "Конфіденційність дітей", p: "UOKnow не призначений для дітей до 13 років. Ми свідомо не збираємо дані від дітей." },
      { h: "Зміни в цій політиці", p: "Ми можемо час від часу оновлювати цю політику. Остання версія завжди доступна за цим URL та в застосунку." },
      { h: "Контакт", p: "З будь-яких питань щодо конфіденційності або запитів на дані, будь ласка, зв'яжіться з нами через сторінку App Store." }
    ]
  },
  sv: {
    title: "UOKnow — Mår du bra nu?",
    subtitle: "Senast uppdaterad: maj 2026",
    dir: "ltr",
    s: [
      { h: "Översikt", p: "UOKnow (\"Mår du bra nu?\") är en personlig säkerhets-check-in-app. När du missar ett incheckningsfönster meddelas dina utsedda nödkontakter. Denna policy förklarar vilka uppgifter vi samlar in, hur vi använder dem och dina rättigheter." },
      { h: "Uppgifter vi samlar in", p: "• Information om nödkontakter – de namn, e-postadresser och telefonnummer du lägger till. Lagras krypterat på din enhet via iOS Keychain.\n• Tidsstämplar för incheckningar – datum och tid för varje incheckning du registrerar.\n• Plats (valfritt) – om du aktiverar platsdelning bifogas dina GPS-koordinater vid incheckningstillfället till aviseringar som skickas till dina kontakter. Plats samlas aldrig in i bakgrunden.\n• Enhetsidentifierare – ett slumpmässigt ID som genereras lokalt på din enhet. Det är inte kopplat till ditt namn eller din identitet." },
      { h: "Hur vi använder dina uppgifter", p: "• För att skicka varningsmeddelanden till dina nödkontakter när en incheckning missas.\n• För att schemalägga dagliga påminnelser som push-meddelanden på din enhet.\n• För att visa din incheckningshistorik i appen." },
      { h: "Delning av uppgifter", p: "Dina nödkontaktuppgifter och enhetsidentifierare överförs till vår server enbart för att möjliggöra leverans av aviseringar. Din plats (om aktiverad) ingår i aviseringsmeddelandet som skickas till dina kontakter.\n\nVi säljer, hyr ut eller delar inte dina uppgifter med annonsörer, analysleverantörer eller tredje parter utöver vad som krävs för att tillhandahålla tjänsten." },
      { h: "Datalagring och säkerhet", p: "• Kontaktinformation är krypterad på din enhet med iOS Keychain (expo-secure-store).\n• Vår server behåller bara den minsta data som behövs för att leverera meddelanden.\n• Inga lösenord eller autentiseringsuppgifter lagras." },
      { h: "Dina rättigheter", p: "• Radera alla appdata när som helst via Inställningar → Återställ alla data.\n• Inaktivera platsdelning när som helst i Inställningar.\n• Ta bort nödkontakter när som helst.\n• Inget konto eller registrering krävs för att använda denna app." },
      { h: "Barns integritet", p: "UOKnow riktar sig inte till barn under 13 år. Vi samlar inte medvetet in data från barn." },
      { h: "Ändringar i denna policy", p: "Vi kan uppdatera denna policy från tid till annan. Den senaste versionen finns alltid tillgänglig på denna URL och i appen." },
      { h: "Kontakt", p: "För frågor relaterade till integritet eller databegäranden, kontakta oss via App Store-listingen." }
    ]
  },
  no: {
    title: "UOKnow — Har du det bra nå?",
    subtitle: "Sist oppdatert: mai 2026",
    dir: "ltr",
    s: [
      { h: "Oversikt", p: "UOKnow («Har du det bra nå?») er en personlig sikkerhets-sjekk-inn-app. Når du glemmer å sjekke inn innen den angitte tidsrammen, varsles dine utpekte nødkontakter. Denne policyen forklarer hvilke data vi samler inn, hvordan vi bruker dem, og dine rettigheter." },
      { h: "Data vi samler inn", p: "• Informasjon om nødkontakter – navnene, e-postadressene og telefonnumrene du legger til. Lagres kryptert på enheten din via iOS Keychain.\n• Tidsstempler for innsjekking – dato og klokkeslett for hver innsjekking du registrerer.\n• Plassering (valgfritt) – hvis du aktiverer plasseringsdeling, legges GPS-koordinatene dine ved innsjekkingstidspunktet ved i varslene som sendes til kontaktene dine. Plassering samles aldri inn i bakgrunnen.\n• Enhetsidentifikator – en tilfeldig ID generert lokalt på enheten din. Den er ikke knyttet til navnet eller identiteten din." },
      { h: "Slik bruker vi dataene dine", p: "• For å sende varselmeldinger til nødkontaktene dine når en innsjekking blir oversett.\n• For å planlegge daglige påminnelses-push-varsler på enheten din.\n• For å vise innsjekkingshistorikken din i appen." },
      { h: "Deling av data", p: "Nødkontaktdetaljer og enhetsidentifikatoren din overføres til serveren vår utelukkende for å muliggjøre levering av varsler. Plasseringen din (hvis aktivert) er inkludert i varselsmeldingen som sendes til kontaktene dine.\n\nVi selger, leier ut eller deler ikke dataene dine med annonsører, analyseleverandører eller tredjeparter utover det som er nødvendig for å levere tjenesten." },
      { h: "Datalagring og sikkerhet", p: "• Kontaktinformasjon er kryptert på enheten din ved hjelp av iOS Keychain (expo-secure-store).\n• Serveren vår beholder bare de minimumsdataene som er nødvendige for å levere varsler.\n• Ingen passord eller autentiseringslegitimasjon lagres." },
      { h: "Dine rettigheter", p: "• Slett alle appdata når som helst via Innstillinger → Tilbakestill alle data.\n• Deaktiver plasseringsdeling når som helst i Innstillinger.\n• Fjern nødkontakter når som helst.\n• Ingen konto eller registrering er nødvendig for å bruke denne appen." },
      { h: "Barns personvern", p: "UOKnow er ikke rettet mot barn under 13 år. Vi samler ikke bevisst inn data fra barn." },
      { h: "Endringer i denne policyen", p: "Vi kan oppdatere denne policyen fra tid til annen. Den nyeste versjonen er alltid tilgjengelig på denne URL-en og i appen." },
      { h: "Kontakt", p: "For spørsmål om personvern eller dataforespørsler, vennligst kontakt oss via App Store-oppføringen." }
    ]
  },
  da: {
    title: "UOKnow — Har du det godt nu?",
    subtitle: "Senest opdateret: maj 2026",

function render(code) {
  const t = T[code] || T.en;
  document.documentElement.lang = code;
  document.documentElement.dir = t.dir || 'ltr';
  document.title = t.title + ' — Privacy Policy';
  document.getElementById('subtitle').textContent = t.subtitle;
  document.getElementById('langSelect').value = code;
  const html = t.s.map((sec, i) =>
    (i > 0 ? '<hr>' : '') +
    '<h2>' + sec.h + '</h2><p>' + sec.p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</p>'
  ).join('');
  document.getElementById('content').innerHTML = html;
  localStorage.setItem('uok-lang', code);
}

(function init() {
  const saved = localStorage.getItem('uok-lang');
  const browser = (navigator.language || 'en').toLowerCase();
  const codes = Object.keys(T);
  const matched = codes.find(c => browser === c.toLowerCase()) ||
                  codes.find(c => browser.startsWith(c.toLowerCase().split('-')[0])) ||
                  'en';
  render(saved && T[saved] ? saved : matched);
})();
</script>
